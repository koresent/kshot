[package]
name = "kshot"
version = "0.1.0"
edition = "2024"
authors = ["Koresent <koresent@pm.me>"]
license = "GPL-3.0-or-later"
description = "Native Wayland screenshot and annotation tool matching Gruvbox Dark aesthetic"

[dependencies]
# Wayland client & protocols
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"

# 2D Graphics, Typography & Image Processing
tiny-skia = "0.12"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Configuration & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
dirs = "6.0"

# Desktop integration & logging
thiserror = "2.0"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
opt-level = 3
codegen-units = 1
